name: Windows desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the personal signing certificate in the ephemeral runner
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:GITHUB_WORKSPACE 'desktop/certificates/study-life-code-signing.cer'
          & certutil.exe -user -addstore -f Root $certificatePath
          if ($LASTEXITCODE -ne 0) { throw "Failed to trust the signing certificate in CurrentUser\Root (exit code $LASTEXITCODE)." }
          & certutil.exe -user -addstore -f TrustedPublisher $certificatePath
          if ($LASTEXITCODE -ne 0) { throw "Failed to trust the signing certificate in CurrentUser\TrustedPublisher (exit code $LASTEXITCODE)." }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json

      - name: Install root and Electron app dependencies
        run: |
          npm ci
          npm ci --prefix desktop-app

      - name: Verify tag and README release metadata
        shell: pwsh
        run: |
          $version = node -p "require('./desktop-app/package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop-app version $version (expected $expectedTag)."
          }
          npm run check:release-readme

      - name: Verify public account configuration
        run: npm run supabase:verify-config -- desktop

      - name: Run release quality gates
        run: npm run check

      - name: Verify packaged updater before publishing
        run: |
          npm run build:desktop
          npm exec --offline -- electron-builder --config electron-builder.release.yml --win nsis --x64 --publish never
          node scripts/verify-desktop-package.mjs --require-signature

      - name: Publish one Windows Release with installer and updater metadata
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 三两事 Windows ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-desktop/study-life-desktop-setup-*.exe
            release-desktop/study-life-desktop-setup-*.exe.blockmap
            release-desktop/latest.yml
            desktop/certificates/study-life-code-signing.cer
