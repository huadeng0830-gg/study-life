name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认 permissions 偏宽，这里收到最小：CI 只需要读代码。
permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    # 不设的话默认 360 分钟，一个卡死的 job 能占配额一整天。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 刻意锁 22 而非 20：Node 22 起内置的实验性 Web Storage 会遮蔽
          # happy-dom 的 Storage，本项目为此踩过一次（1865 条用例里 552 条连带变红）。
          # 跑 20 就等于**跑不到**那条代码路径，那次修复得不到任何持续验证。
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      # 类型债务棘轮。不放在 npm run check 里 —— 它要跑一遍全量 checkJs（约 1 分钟），
      # 而 checkJs 目前并没有真正打开（tsconfig 里 checkJs 仍是 false，见
      # scripts/typecheck-ratchet.mjs 顶部的实测数据）。它守的是两件事：
      # 1) 硬红线 TS2304「引用了不存在的名字」必须为 0 —— 这类几乎都是
      #    运行时会抛 ReferenceError 的真缺陷；
      # 2) 总数不许比基线增长。
      - name: Type-debt ratchet
        run: npm run typecheck:ratchet

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  desktop-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json

      - name: Install root and Electron app dependencies
        run: |
          npm ci
          npm ci --prefix desktop-app

      - name: Build and inspect the Windows app package
        run: |
          npm run build:desktop
          npx electron-builder --config electron-builder.yml --dir --win --x64 --publish never
          npm run desktop:verify

  # 依赖漏洞与过期提示。npm audit 放在独立 job：它是"信息"而非"门禁"，
  # 单独跑失败不会把整个 PR 标红，但会在 job summary 里看得见。
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Audit
        run: npm audit --audit-level=high || true
