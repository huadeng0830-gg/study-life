name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      # 类型债务棘轮。不放在 npm run check 里 —— 它要跑一遍全量 checkJs（约 1 分钟），
      # 而 checkJs 目前并没有真正打开（tsconfig 里 checkJs 仍是 false，见
      # scripts/typecheck-ratchet.mjs 顶部的实测数据）。它守的是两件事：
      # 1) 硬红线 TS2304「引用了不存在的名字」必须为 0 —— 这类几乎都是
      #    运行时会抛 ReferenceError 的真缺陷；
      # 2) 总数不许比基线增长。
      - name: Type-debt ratchet
        run: npm run typecheck:ratchet

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
