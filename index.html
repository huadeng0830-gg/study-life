<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4f7cff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="学习生活台" />
    <meta name="description" content="个人的学习生活管理平台：课程表、待办、倒计时、清单、账单" />
    <title>学习生活台</title>
  </head>
  <body>
    <div id="app">
      <div class="startup-loading" role="status" aria-live="polite">
        <div class="startup-loading__mark">学</div>
        <strong>正在打开学习生活台</strong>
        <span>本地资料读取较慢时，页面仍会优先显示</span>
      </div>
    </div>
    <style>
      .startup-loading,.startup-error{box-sizing:border-box;min-height:100vh;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f4f6fa}.startup-loading__mark{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;color:#fff;font-size:24px;font-weight:800;background:#456fe8;box-shadow:0 12px 28px rgba(69,111,232,.25)}.startup-loading span,.startup-error p{max-width:320px;color:#6b7280;font-size:13px;line-height:1.6}.startup-error h1{margin:0;font-size:22px}.startup-error button{padding:10px 18px;border:0;border-radius:10px;color:#fff;font-weight:700;background:#456fe8}
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
